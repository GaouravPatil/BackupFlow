server.port=${SERVER_PORT:8080}

# Datasource — env overridable for Docker Compose
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/backupflow}
spring.datasource.username=${DB_USERNAME:backupflow}
spring.datasource.password=${DB_PASSWORD:backupflow}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Actuator + Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=backupflow
