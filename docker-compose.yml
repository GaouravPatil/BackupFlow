services:
  postgres:
    image: postgres:16
    container_name: backupflow-postgres
    environment:
      POSTGRES_DB: backupflow
      POSTGRES_USER: backupflow
      POSTGRES_PASSWORD: backupflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backupflow -d backupflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: backupflow-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/backupflow
      DB_USERNAME: backupflow
      DB_PASSWORD: backupflow
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: backupflow-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.1.0
    container_name: backupflow-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
